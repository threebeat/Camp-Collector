<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0c1a" />
    <meta
      name="description"
      content="A collector and automatic battler in a world of permanent night. Build lasting companies, explore a world, develop their equipment and abilities, and send them on real-time expeditions."
    />
    <title>Evernight · A Fire in the Night</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=17" />
    <link rel="stylesheet" href="./nightfall.css?v=17" />
    <link rel="stylesheet" href="./evernight.css?v=17" />
    <link rel="stylesheet" href="./pixel.css?v=17" />
    <link rel="stylesheet" href="/homestead.css?v=17" />
    <link rel="stylesheet" href="./game-shell.css?v=17" />
  </head>
  <body>
    <div
      id="game-window"
      data-learning="intro"
      role="region"
      aria-label="Evernight game window"
    >
      <header class="site-header game-hud">
        <button
          id="game-home"
          class="icon-button"
          aria-label="Return to Camp"
          hidden
        >
          ⌂
        </button>
        <button class="brand" id="brand-home" aria-label="Camp overview">
          <strong id="brand-name">Evernight</strong
          ><span id="window-context">A fire in the night</span>
        </button>
        <nav id="main-nav" aria-label="Game menu"></nav>
        <div class="resources">
          <span id="gold-count"></span><span id="gem-count"></span
          ><button
            class="icon-button"
            id="settings-btn"
            aria-label="Settings"
          ></button
          ><button
            class="icon-button"
            id="fullscreen-btn"
            aria-label="Enter fullscreen"
            aria-pressed="false"
          ></button>
        </div>
        <div id="tutorial-bar" class="tutorial-bar" hidden></div>
      </header>
      <main class="app">
        <div class="clock-status" id="clock-status" role="status" hidden></div>
        <div id="app-content">
          <div class="empty-collection">
            <h1>The Camp</h1>
            <p>Gathering your company…</p>
          </div>
        </div>
        <footer class="app-footer">
          <span>Evernight · 0.3</span
          ><span id="save-status">Saved on this device · background 1×</span>
        </footer>
      </main>
      <section
        id="opening-scene"
        aria-label="Evernight opening"
        aria-live="polite"
        hidden
      ></section>
      <aside
        id="learning-coach"
        aria-label="First journey tutorial"
        hidden
      ></aside>
      <p id="game-control-hint" aria-live="off" hidden></p>
      <aside
        id="resident-actions"
        aria-label="Adventurer actions"
        hidden
      ></aside>
      <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./app.js?v=17"></script>
  </body>
</html>
